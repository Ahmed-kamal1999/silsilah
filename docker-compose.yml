services:
  app:
    build: .
    container_name: silsilah-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: silsilah
      DB_USERNAME: silsilah
      DB_PASSWORD: secret
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: silsilah-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.4
    container_name: silsilah-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: silsilah
      MYSQL_USER: silsilah
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - dbdata:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: silsilah-pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - db

  vite:
    build: .
    container_name: silsilah-vite
    profiles: ["dev"]
    command: npm run dev -- --host 0.0.0.0
    entrypoint: []
    working_dir: /var/www/html
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules

volumes:
  dbdata:
  node_modules:
